<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>葡萄牙之旅 · 里斯本 & 阿尔加维</title>
  <meta name="description" content="私人旅行专属页面 — 里斯本与阿尔加维">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="travel-wrapper">
    
    <!-- 顶部极简标题 -->
    <header class="page-header">
      <span class="trip-tag">🇵🇹 葡萄牙私人旅程</span>
      <h1 class="main-title">里斯本 & 阿尔加维</h1>
      <p class="sub-title">两个主要目的地 · 随身极简指南</p>
    </header>

    <main class="cities-container">

      <!-- 城市 1：里斯本 -->
      <article class="city-card">
        <div class="city-cover cover-lisbon">
          <span class="city-num">01</span>
          <span class="city-emoji">🚋</span>
        </div>
        <div class="city-content">
          <div class="city-title-row">
            <div>
              <h2 class="city-name">里斯本</h2>
              <span class="city-en">Lisbon</span>
            </div>
            <span class="city-badge">城市初探</span>
          </div>
          <p class="city-tagline">经典老城、黄色电车、七丘日落与海鲜美食</p>
          
          <div class="city-actions">
            <a href="https://maps.google.com/?q=Lisbon+Portugal" target="_blank" rel="noopener noreferrer" class="btn-city-link">
              <span>📍</span> 谷歌地图 ↗
            </a>
          </div>
        </div>
      </article>

      <!-- 连接路线提示 -->
      <div class="route-divider">
        <span class="route-line"></span>
        <span class="route-badge">沿途南下 🚗 约 2.5 小时</span>
        <span class="route-line"></span>
      </div>

      <!-- 城市 2：阿尔加维 -->
      <article class="city-card">
        <div class="city-cover cover-algarve">
          <span class="city-num">02</span>
          <span class="city-emoji">🌊</span>
        </div>
        <div class="city-content">
          <div class="city-title-row">
            <div>
              <h2 class="city-name">阿尔加维</h2>
              <span class="city-en">Algarve</span>
            </div>
            <span class="city-badge">海滨度假</span>
          </div>
          <p class="city-tagline">壮美悬崖海岸、海蚀洞穴、金沙滩与海风晚霞</p>

          <div class="city-actions">
            <a href="https://maps.google.com/?q=Algarve+Portugal" target="_blank" rel="noopener noreferrer" class="btn-city-link">
              <span>📍</span> 谷歌地图 ↗
            </a>
          </div>
        </div>
      </article>

      <!-- 极简随身备忘便签卡 -->
      <section class="memo-card">
        <div class="memo-header">
          <span class="memo-icon">📌</span>
          <span class="memo-title">随身备忘（点击可编辑）</span>
        </div>
        <div id="quick-memo" class="memo-body" contenteditable="true" spellcheck="false">
[可以在这里随手记下航班号、酒店名字、或者待办小提醒，内容会自动保存在手机本地。]
        </div>
      </section>

    </main>

    <!-- 底部 -->
    <footer class="page-footer">
      <p>祝旅途平安舒心 🌅</p>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
