<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>里斯本 & 阿尔加维</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="travel-wrapper">
    
    <header class="page-header">
      <h1 class="main-title">里斯本 & 阿尔加维</h1>
    </header>

    <main class="cities-container">

      <!-- 城市 1：里斯本 -->
      <article class="city-card">
        <div class="city-cover cover-lisbon">
          <span class="city-num">01</span>
          <span class="city-emoji">🚋</span>
        </div>
        <div class="city-content">
          <div class="city-title-row">
            <h2 class="city-name">里斯本</h2>
            <span class="city-en">Lisbon</span>
          </div>
          <div class="city-actions">
            <a href="https://maps.google.com/?q=Lisbon+Portugal" target="_blank" rel="noopener noreferrer" class="btn-city-link">
              谷歌地图 ↗
            </a>
          </div>
        </div>
      </article>

      <!-- 城市 2：阿尔加维 -->
      <article class="city-card">
        <div class="city-cover cover-algarve">
          <span class="city-num">02</span>
          <span class="city-emoji">🌊</span>
        </div>
        <div class="city-content">
          <div class="city-title-row">
            <h2 class="city-name">阿尔加维</h2>
            <span class="city-en">Algarve</span>
          </div>
          <div class="city-actions">
            <a href="https://maps.google.com/?q=Algarve+Portugal" target="_blank" rel="noopener noreferrer" class="btn-city-link">
              谷歌地图 ↗
            </a>
          </div>
        </div>
      </article>

    </main>

  </div>
</body>
</html>
