<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lisbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#d94f26"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#lisbonGrad)"/>
  <!-- Decorative Portuguese Tile (Azulejo) Star Motif in background -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="6" fill="none">
    <circle cx="256" cy="256" r="180"/>
    <path d="M 256,76 L 256,436 M 76,256 L 436,256"/>
    <path d="M 128,128 L 384,384 M 128,384 L 384,128"/>
  </g>
  <!-- Stylized Iconic Yellow Lisbon Tram 28 -->
  <g filter="url(#shadow)" transform="translate(106, 126)">
    <!-- Tram roof -->
    <path d="M 30 50 Q 150 30 270 50 Q 290 55 290 70 L 10 70 Q 10 55 30 50 Z" fill="#ffffff"/>
    <rect x="70" y="20" width="160" height="15" rx="7" fill="#64748b"/>
    <line x1="150" y1="20" x2="150" y2="0" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <!-- Tram body (Lisbon iconic yellow) -->
    <rect x="15" y="70" width="270" height="150" rx="20" fill="#facc15"/>
    <rect x="15" y="150" width="270" height="70" rx="0" fill="#eab308"/>
    <!-- Windows -->
    <rect x="35" y="85" width="45" height="55" rx="8" fill="#1e293b"/>
    <rect x="95" y="85" width="45" height="55" rx="8" fill="#1e293b"/>
    <rect x="160" y="85" width="45" height="55" rx="8" fill="#1e293b"/>
    <rect x="220" y="85" width="45" height="55" rx="8" fill="#1e293b"/>
    <!-- Window shine -->
    <path d="M 40 135 L 75 90 M 100 135 L 135 90 M 165 135 L 200 90 M 225 135 L 260 90" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <!-- Tram number 28 badge -->
    <rect x="120" y="165" width="60" height="30" rx="8" fill="#ffffff"/>
    <text x="150" y="186" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="20" fill="#0f172a" text-anchor="middle">28</text>
    <!-- Headlights -->
    <circle cx="50" cy="180" r="14" fill="#ffffff"/>
    <circle cx="50" cy="180" r="8" fill="#fef08a"/>
    <circle cx="250" cy="180" r="14" fill="#ffffff"/>
    <circle cx="250" cy="180" r="8" fill="#fef08a"/>
    <!-- Bumper -->
    <rect x="25" y="220" width="250" height="16" rx="6" fill="#334155"/>
    <!-- Wheels -->
    <rect x="55" y="236" width="45" height="18" rx="6" fill="#0f172a"/>
    <rect x="200" y="236" width="45" height="18" rx="6" fill="#0f172a"/>
  </g>
</svg>
