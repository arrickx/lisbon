<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="26" fill="#fbe8d8"/>
  <!-- Travel Suitcase & Plane Icon -->
  <g transform="translate(18, 20)">
    <!-- Handle -->
    <rect x="22" y="4" width="20" height="12" rx="4" fill="none" stroke="#d26749" stroke-width="4"/>
    <!-- Suitcase body -->
    <rect x="6" y="14" width="52" height="42" rx="10" fill="#ffffff" stroke="#d26749" stroke-width="4"/>
    <!-- Straps -->
    <line x1="20" y1="14" x2="20" y2="56" stroke="#f4d4c5" stroke-width="4"/>
    <line x1="44" y1="14" x2="44" y2="56" stroke="#f4d4c5" stroke-width="4"/>
    <!-- Lock / Tag -->
    <circle cx="32" cy="35" r="4" fill="#d26749"/>
    <!-- Wheels -->
    <rect x="14" y="55" width="8" height="6" rx="3" fill="#887869"/>
    <rect x="42" y="55" width="8" height="6" rx="3" fill="#887869"/>
  </g>
</svg>
